name: Release (tagged)

# A release is a merged version bump. `make bump-patch|minor|major` writes the
# new tag into manifest.yaml; when that lands on main, this workflow tags the
# merge commit and publishes it. Nobody has to push a tag by hand, though a
# pushed tag still releases, and a dispatch re-runs a release that failed.
on:
  push:
    branches:
      - main
    paths:
      - manifest.yaml
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3); empty for the one manifest.yaml names"
        required: false

# Never cancelled: a release half published (a GitHub release with no
# AppImage) is worse than two that queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  # The C++ engine's binary tarball, AppImage and macOS DMG were built here until
  # the C++ tree was removed (ADR-0021). The Rust engine ships as the Flatpak
  # (publish-flatpak.yaml); a tag publishes the release notes and the AppImage
  # as a release asset (appimage.yaml), which FlatPark and anyone without
  # Flatpak download. Compass is a hard fork and publishes nothing to npm:
  # the SDK keeps upstream's package name, @vicinae/api, so that store
  # extensions build unchanged (ADR-0020), and that package is upstream's.
  resolve-tag:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release: ${{ steps.meta.outputs.release }}
      create: ${{ steps.meta.outputs.create }}
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Resolve tag
        id: meta
        shell: bash
        # The tag rides in through the environment, never through ${{ }}
        # interpolation: the runner expands expressions before bash parses
        # the script, so interpolated input runs as code before the format
        # check below ever sees it (#227).
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          manifest_tag() { sed -n 's/^  tag: "\(.*\)"$/\1/p' manifest.yaml; }
          if [[ "$REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          elif [[ "$EVENT" == "workflow_dispatch" && -n "${INPUT_TAG:-}" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(manifest_tag)"
          fi

          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag '$TAG' does not match expected format (e.g. v1.2.3)." >&2
            exit 1
          fi

          # A tag that already exists was released (or is being released by
          # its own push). A manifest edit that isn't a bump releases nothing;
          # a dispatch re-runs that release.
          release=true
          create=false
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            if [[ "$EVENT" == "push" && "$REF_TYPE" == "branch" ]]; then
              echo "$TAG already exists; manifest.yaml changed without a version bump."
              release=false
            fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
            :
          else
            create=true
          fi

          {
            echo "tag=$TAG"
            echo "release=$release"
            echo "create=$create"
          } >> "$GITHUB_OUTPUT"

  # Tags the commit this run is on: on a merged bump, the merge commit. Pushed
  # with the workflow token, the tag does not start a second run of this file,
  # nor the VM tier that a pushed tag starts, so this dispatches that on the tag.
  create-tag:
    needs: resolve-tag
    if: needs.resolve-tag.outputs.create == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4.4.0  # zizmor: ignore[artipacked] a later step pushes the release tag with these credentials
        with:
          fetch-depth: 1
      - name: Tag ${{ needs.resolve-tag.outputs.tag }}
        env:
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
      - name: Start the VM tier on ${{ needs.resolve-tag.outputs.tag }}
        # It answers for the release; it doesn't gate publishing it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: gh workflow run vm-tier.yaml --ref "$TAG" --repo "$GITHUB_REPOSITORY"

  publish-release:
    needs: [resolve-tag, create-tag]
    if: >-
      !cancelled() && needs.resolve-tag.outputs.release == 'true' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.6.2  # zizmor: ignore[superfluous-actions] swapping in gh release changes how the release is published
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: ${{ needs.resolve-tag.outputs.tag }}
          generate_release_notes: true
          make_latest: true

  appimage:
    needs: [resolve-tag, create-tag]
    if: >-
      !cancelled() && needs.resolve-tag.outputs.release == 'true' &&
      (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    uses: $/.github/workflows/appimage.yaml
    with:
      # The tag, not the run's commit: a re-run dispatched from main later
      # still ships what the tag names.
      ref: ${{ needs.resolve-tag.outputs.tag }}

  attach-appimage:
    name: Attach the AppImage to the release
    needs: [resolve-tag, publish-release, appimage]
    # Explicit, because create-tag is skipped whenever the tag already exists,
    # and a job downstream of a skipped one is skipped unless it says otherwise.
    if: >-
      !cancelled() && needs.publish-release.result == 'success' &&
      needs.appimage.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: appimage
      - name: Upload the AppImage and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          # Through the environment, never ${{ }} in the script (#227).
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sha256sum Compass-x86_64.AppImage > Compass-x86_64.AppImage.sha256
          cat Compass-x86_64.AppImage.sha256
          gh release upload "$TAG" Compass-x86_64.AppImage Compass-x86_64.AppImage.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"

  # The in-tree Homebrew formula names the release tarball, whose checksum only
  # exists once the tag does, so the bump leaves a placeholder. This fills it
  # in with a PR against main.
  homebrew-sha:
    name: Fill the Homebrew formula's sha256
    needs: [resolve-tag, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    runs-on: ubuntu-24.04
    # Dispatches the six validation workflows on the PR branch and waits for
    # them; the Rust job alone can take longer than the old ten-minute budget.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write  # dispatch the validation workflows on the PR branch
    steps:
      - uses: actions/checkout@v4.4.0  # zizmor: ignore[artipacked] a later step pushes the Homebrew branch with these credentials
        with:
          ref: main
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
        run: |
          set -euo pipefail
          formula=packaging/homebrew/compass.rb
          if ! grep -q "/tags/${TAG}.tar.gz\"" "$formula" \
             || ! grep -q 'REPLACE_WITH_RELEASE_TARBALL_SHA256' "$formula"; then
            echo "The formula on main is not waiting for ${TAG}'s checksum."
            exit 0
          fi
          sha=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i "s/REPLACE_WITH_RELEASE_TARBALL_SHA256/${sha}/" "$formula"
          branch="release/homebrew-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "homebrew: the ${TAG} tarball's sha256"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "homebrew: the ${TAG} tarball's sha256" \
            --body "Fills in the checksum the version bump left as a placeholder: sha256 of https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"

          # A pull_request event caused by GITHUB_TOKEN deliberately does not
          # start its workflows, so a PR opened this way used to get all six
          # required checks as zero-job failures until a human re-triggered
          # them. workflow_dispatch is the documented exception. Run the
          # validation workflows on the PR branch here; their check contexts
          # replace the empty ones.
          workflows=(
            rust.yaml
            shell.yaml
            format.yaml
            nix-format.yaml
            actions-security.yml
            perf.yaml
          )
          run_ids=()
          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" --ref "$branch" --repo "$GITHUB_REPOSITORY"
            run_id=
            for _ in {1..30}; do
              run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
                --branch "$branch" --event workflow_dispatch --limit 1 \
                --json databaseId --jq '.[0].databaseId')
              [[ -n "$run_id" ]] && break
              sleep 2
            done
            [[ -n "$run_id" ]] || { echo "::error::no dispatch run appeared for $workflow"; exit 1; }
            run_ids+=("$run_id")
          done
          failed=0
          for run_id in "${run_ids[@]}"; do
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 30 --exit-status || failed=1
          done
          if (( failed )); then
            echo "::error::a validation workflow failed on $branch"
            exit 1
          fi
