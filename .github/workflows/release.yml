name: Release (tagged)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The default for every job in this file. Jobs that need more say so
# themselves, and a job-level block REPLACES this one rather than adding to it —
# so an elevated job must restate `contents: read` if it also checks out code.
#
# The point is what happens to the NEXT job somebody adds here: without this it
# inherits the repository default, which may be write-all. With it, a new job
# has to ask.
permissions:
  contents: read

jobs:
  build-binary:
    runs-on: ubuntu-24.04
    # Plain upstream Arch: the build deps are one pacman invocation, so a
    # prebuilt image is not worth a registry dependency. Installed below
    # from the same script the image Dockerfile uses.
    container: archlinux:latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
      artifact: ${{ steps.meta.outputs.artifact }}
    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}/install

    steps:
      # actions/checkout silently falls back to a REST tarball with no .git when
      # git is missing, which breaks every later git step. The Depot image had
      # git baked in; plain archlinux:latest does not.
      - name: Bootstrap git
        run: pacman -Sy --needed --noconfirm git

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag || '' }}"
            if [[ -z "$TAG" ]]; then
              echo "When dispatching manually, you must provide 'tag' (e.g. v1.2.3)." >&2
              exit 1
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          # Optional: validate tag format like v1.2.3 (allow v1 or v1.2 etc.)
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag '$TAG' does not match expected format (e.g. v1.2.3)." >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "artifact=vicinae-linux-x86_64-$TAG.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.tag }}

      - name: Install build dependencies
        run: ./scripts/runners/arch/install-deps.sh

      - name: Resolve commit
        id: commit
        run: |
          git config --global --add safe.directory "$(pwd)"
          echo "commit=$(git rev-parse --short=9 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare dirs
        run: mkdir -p build install

      - name: Configure CMake
        run: |
          cd build
          cmake -G Ninja .. \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5  \
            -DBUILD_TESTS=ON  \
            -DVICINAE_PROVENANCE=binary_release \
            -DVICINAE_GIT_TAG="${{ steps.meta.outputs.tag }}" \
            -DVICINAE_GIT_COMMIT_HASH="${{ steps.commit.outputs.commit }}" \
            -DLTO=ON \
            -DUSE_SYSTEM_CMARK_GFM=OFF \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"

      - name: Build
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel $(nproc)

      - name: Run Tests
        run: make test

      - name: Install
        run: |
          cd build
          cmake --install . --config ${BUILD_TYPE}

      - name: Package (tar install dir)
        run: |
          tar -czvf "${{ steps.meta.outputs.artifact }}" -C "${INSTALL_DIR}" .

      - name: Upload binary as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-linux-x86_64
          path: ${{ steps.meta.outputs.artifact }}
          retention-days: 7
          if-no-files-found: error
          overwrite: true


  build-appimage:
    # Disabled 2026-09-12 alongside build-appimage.yaml: AppImage is not a channel
    # we distribute through, and the ghcr build-env image this pulls is not
    # published, so the job could only fail at `docker pull ... manifest unknown`.
    #
    # It was blocking more than itself. `publish-npm` and `publish-release` both
    # listed it in `needs:`, so a failure here skipped them -- releases were
    # already impossible, not merely missing an AppImage. Gating the job and
    # dropping it from those two `needs:` lists restores releases; it does mean a
    # release no longer ships a .AppImage, which is the point rather than a
    # side effect.
    #
    # To restore: set `if: true` here, publish the build-env image by dispatching
    # build-appimage-image.yaml once, and put `build-appimage` back into the
    # `needs:` of publish-npm and publish-release below.
    if: false
    needs: build-binary
    runs-on: ${{ matrix.target.runner }}
    container:
      image: ghcr.io/${{ github.repository }}/build-env:${{ matrix.target.tag }}
      # ghcr packages are private until published publicly; GITHUB_TOKEN
      # can pull the ones this repository owns. Once the package is made
      # public these credentials and the packages:read scope can go.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - arch: amd64
            runner: ubuntu-24.04
            tag: appimage-amd64-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
            tag: appimage-arm64-latest
    name: build-appimage (${{ matrix.target.arch }})
    env:
      BUILD_TYPE: Release
      INSTALL_DIR: ${{ github.workspace }}/install
      APP_DIR: ${{ github.workspace }}/appdir
      APPIMAGE_EXTRACT_AND_RUN: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.build-binary.outputs.tag }}

      - name: Prepare dirs
        run: mkdir -p build install

      - name: Configure CMake
        run: |
          cd build
          cmake -G Ninja ..                           \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE}          \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5        \
            -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}"   \
            -DVICINAE_PROVENANCE=appimage             \
            -DVICINAE_GIT_TAG="${{ needs.build-binary.outputs.tag }}" \
            -DVICINAE_GIT_COMMIT_HASH="${{ needs.build-binary.outputs.commit }}" \
            -DLTO=ON

      - name: Build
        run: |
          cmake --build build --config ${BUILD_TYPE} --parallel $(nproc)

      - name: Install
        run: |
          cmake --install build

      - name: Make AppImage
        run: |
          chmod +x ./scripts/mkappimage.sh
          ./scripts/mkappimage.sh "${INSTALL_DIR}" "${APP_DIR}"

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: vicinae-appimage-${{ matrix.target.arch }}
          path: "*.AppImage"
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  build-macos-dmg:
    needs: build-binary
    uses: ./.github/workflows/macos-dmg.yaml
    secrets: inherit
    with:
      tag: ${{ needs.build-binary.outputs.tag }}
      commit: ${{ needs.build-binary.outputs.commit }}

  publish-npm:
    # build-appimage removed from needs while it is gated off; see the note there.
    needs: [build-binary, build-macos-dmg]
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/api-release.yml
    with:
      tag: ${{ needs.build-binary.outputs.tag }}

  publish-release:
    # build-appimage removed from needs while it is gated off; see the note there.
    needs: [build-binary, build-macos-dmg, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-binary.outputs.tag }}
          name: ${{ needs.build-binary.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: dist/*

  trigger-packaging:
    needs: publish-release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger bumpver in packaging-arch
        env:
          GH_TOKEN: ${{ secrets.PACKAGING_AUR_TOKEN }}
        run: |
          gh workflow run bumpver.yml --repo vicinaehq/packaging-arch

