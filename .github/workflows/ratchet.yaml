name: Ratchet

# Counted metrics held at a budget that only goes down: .unwrap(), .expect(, oversized modules and undated cargo-deny ignores.
# Budgets and patterns live in .ratchet.toml; the checker is the shared
# count-ratchet action in tuna-os/.github, so the rules cannot drift between
# repos.
#
#   count > budget   fails: remove what the change added.
#   count < budget   fails: write the new, lower budget (the error names it),
#                    so an improvement stays locked in.
#   budget raised    fails on a pull request unless it has the
#                    `ratchet-raise` label (labeled/unlabeled re-run it).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    name: Ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      # The raise check fetches origin/<base> itself (depth 1), so the
      # checkout stays shallow.
      - uses: tuna-os/.github/.github/actions/count-ratchet@8ecf20e5800fd80bde03d572ab1e3bbcb5b2cf17 # main # zizmor: ignore[ref-version-mismatch] pinned to a reviewed main commit; Renovate bumps the digest, so main may be ahead
